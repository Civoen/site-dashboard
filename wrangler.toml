name = "project-dashboard"
pages_build_output_dir = "."

# After running:
#   wrangler kv namespace create PROJECTS_KV
# paste the returned id below. This is only needed for local dev
# (wrangler pages dev). For the live site, add the same binding in the
# Cloudflare dashboard under Pages > your project > Settings > Functions >
# KV namespace bindings.
[[kv_namespaces]]
binding = "PROJECTS_KV"
id = "2faf328632dd4fa2960fc7cc0503964a"

# Set the actual secret value with:
#   wrangler pages secret put DASHBOARD_KEY --project-name=your-pages-project-name
# Do not put the real key in this file.
