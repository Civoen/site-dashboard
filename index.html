<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project dashboard</title>
<style>
  :root{
    --bg:#131210;
    --card:#1c1a17;
    --border:#2c2a26;
    --border-strong:#3d3a34;
    --text:#f0eee8;
    --text-secondary:#a8a399;
    --text-muted:#756f63;
    --radius:8px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font);
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1400px;
    margin:0 auto;
    padding:56px 48px 260px;
  }
  .topbar{
    display:flex;
    justify-content:flex-end;
    margin-bottom:16px;
  }
  .icon-btn{
    display:flex;
    align-items:center;
    gap:6px;
    background:none;
    border:1px solid var(--border);
    color:var(--text-secondary);
    font-size:12px;
    font-family:inherit;
    padding:8px 12px;
    border-radius:var(--radius);
    cursor:pointer;
  }
  .icon-btn:hover{ border-color:var(--border-strong); color:var(--text); }
  .sync-banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    font-size:12px;
    color:var(--text-muted);
    border:1px dashed var(--border-strong);
    border-radius:var(--radius);
    padding:10px 14px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .sync-banner button{
    background:none;
    border:none;
    color:#7ea1f2;
    font-size:12px;
    font-family:inherit;
    cursor:pointer;
    padding:0;
  }
  .project-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:16px;
  }
  .project{
    position:relative;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    row-gap:12px;
    gap:18px;
    padding:18px 20px 18px 18px;
    background:var(--card);
    border:1px solid var(--border);
    border-left-width:4px;
    border-radius:0 12px 12px 0;
  }
  .dot{
    width:11px;
    height:11px;
    border-radius:50%;
    flex-shrink:0;
  }
  .meta{flex:1; min-width:0;}
  .meta p.name{
    font-weight:600;
    font-size:16px;
    margin:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .meta p.date{
    font-size:12px;
    color:var(--text-secondary);
    margin:2px 0 0;
  }
  .links{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    flex:1 1 220px;
    min-width:0;
  }
  .link-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:8px 12px;
    border:1px solid var(--border-strong);
    border-radius:var(--radius);
    text-decoration:none;
    color:var(--text);
    font-size:13px;
    background:transparent;
    white-space:nowrap;
    flex:1 1 100px;
  }
  .link-btn:hover{ background:#242220; }
  .link-btn.primary{
    border-color:transparent;
    background:rgba(126,161,242,0.15);
    color:#a9c1f5;
  }
  .link-btn.disabled{
    color:var(--text-muted);
    border-style:dashed;
    pointer-events:none;
  }
  .icon{ width:15px; height:15px; flex-shrink:0; }
  .icon-sm{ width:14px; height:14px; flex-shrink:0; }
  .row-actions{
    display:flex;
    gap:2px;
    flex-shrink:0;
  }
  .edit-btn, .del-btn{
    background:transparent;
    border:none;
    color:var(--text-muted);
    cursor:pointer;
    padding:8px;
    border-radius:6px;
    display:flex;
  }
  .edit-btn:hover{ color:#a9c1f5; background:rgba(126,161,242,0.12); }
  .del-btn:hover{ color:#e2766a; background:rgba(226,118,106,0.12); }
  .drag-handle{
    display:flex;
    align-items:center;
    color:var(--text-muted);
    cursor:grab;
    padding:4px;
    flex-shrink:0;
    touch-action:none;
  }
  .drag-handle:hover{ color:var(--text-secondary); }
  .project.dragging{ opacity:0.35; }
  .project.drag-over{ border-top:2px solid #7ea1f2; }
  .move-group{
    display:flex;
    flex-direction:column;
    flex-shrink:0;
  }
  .move-btn{
    background:transparent;
    border:none;
    color:var(--text-muted);
    cursor:pointer;
    padding:2px;
    border-radius:4px;
    display:flex;
  }
  .move-btn:hover{ color:var(--text-secondary); background:#242220; }
  .move-btn:disabled{ opacity:0.25; cursor:default; }
  .move-btn:disabled:hover{ background:none; }
  .new-site-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    width:100%;
    padding:14px;
    border:1.5px dashed var(--border-strong);
    border-radius:var(--radius);
    background:transparent;
    color:var(--text-secondary);
    font-size:14px;
    font-family:inherit;
    cursor:pointer;
  }
  .new-site-btn:hover{
    border-color:var(--text-muted);
    color:var(--text);
    background:#1a1815;
  }
  .empty{
    text-align:center;
    padding:48px 24px;
    color:var(--text-muted);
    font-size:14px;
    border:1px dashed var(--border-strong);
    border-radius:12px;
    margin-bottom:16px;
  }

  /* form / settings pages */
  #new-site-view{ display:none; }
  .back-btn{
    display:flex;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    color:var(--text-secondary);
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
    padding:6px 0;
    margin-bottom:20px;
  }
  .back-btn:hover{ color:var(--text); }
  .form-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:24px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .field label{
    display:block;
    font-size:13px;
    color:var(--text-secondary);
    margin-bottom:6px;
  }
  .field input[type="text"], .field input[type="url"], .field input[type="password"]{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--border-strong);
    border-radius:var(--radius);
    font-size:16px;
    font-family:inherit;
    background:#0f0e0c;
    color:var(--text);
  }
  .field input:focus{
    outline:none;
    border-color:#7ea1f2;
    box-shadow:0 0 0 3px rgba(126,161,242,0.15);
  }
  .color-row{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .color-row input[type="color"]{
    width:48px;
    height:36px;
    padding:2px;
    border:1px solid var(--border-strong);
    border-radius:6px;
    background:none;
    cursor:pointer;
  }
  .swatches{ display:flex; gap:8px; }
  .swatch{
    width:24px; height:24px; border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
  }
  .swatch.selected{ border-color:var(--text); }
  .save-btn{
    background:#f0eee8;
    color:#131210;
    border:none;
    padding:12px;
    border-radius:var(--radius);
    font-size:14px;
    font-family:inherit;
    font-weight:600;
    cursor:pointer;
    margin-top:4px;
  }
  .save-btn:hover{ background:#d8d5cc; }
  .hint{ font-size:12px; color:var(--text-muted); margin-top:-8px; }

  /* ---- wide desktop: use horizontal space instead of one long column ---- */
  @media (min-width: 900px){
    .project-list{
      display:grid;
      grid-template-columns:repeat(2, 1fr);
      gap:14px;
    }
  }
  @media (min-width: 1300px){
    .project-list{
      grid-template-columns:repeat(3, 1fr);
    }
  }

  /* ---- tablet ---- */
  @media (max-width: 720px){
    .wrap{ padding:32px 20px 80px; }
  }

  /* ---- mobile ---- */
  @media (max-width: 480px){
    .wrap{ padding:24px 16px 72px; }
    .project{
      flex-direction:column;
      align-items:flex-start;
      padding-right:96px;
    }
    .meta{ width:100%; }
    .drag-handle{ display:none; }
    .row-actions{
      position:absolute;
      top:12px;
      right:12px;
      gap:4px;
    }
    .links{ flex-direction:column; }
    .link-btn{ width:100%; }
    .form-card{ padding:18px; }
    .color-row{ gap:10px; }
    h1, .icon-btn{ font-size:13px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="sync-banner-slot"></div>

  <div id="dashboard-view">
    <div class="project-list" id="project-list"></div>
    <button class="new-site-btn" id="new-site-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      New site
    </button>
  </div>

  <div id="new-site-view">
    <button class="back-btn" id="back-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to dashboard
    </button>
    <div class="form-card">
      <div class="field">
        <label for="f-name">Project name</label>
        <input type="text" id="f-name" placeholder="e.g. My New Project">
      </div>
      <div class="field">
        <label for="f-repo">Repo link</label>
        <input type="url" id="f-repo" placeholder="https://github.com/user/repo">
      </div>
      <div class="field">
        <label for="f-worker">Worker link</label>
        <input type="url" id="f-worker" placeholder="https://dash.cloudflare.com/.../workers/...">
      </div>
      <div class="field">
        <label for="f-site">Live site link</label>
        <input type="url" id="f-site" placeholder="https://example.com">
      </div>
      <div class="field">
        <label>Box colour</label>
        <div class="color-row">
          <input type="color" id="f-color" value="#7f77dd">
          <div class="swatches">
            <div class="swatch" style="background:#c64d2e" data-color="#c64d2e"></div>
            <div class="swatch" style="background:#fecf41" data-color="#fecf41"></div>
            <div class="swatch" style="background:#1fd05c" data-color="#1fd05c"></div>
            <div class="swatch" style="background:#378ade" data-color="#378ade"></div>
            <div class="swatch" style="background:#d4537e" data-color="#d4537e"></div>
          </div>
        </div>
        <div class="hint">Pick a colour so this project is easy to spot at a glance.</div>
      </div>
      <button class="save-btn" id="save-btn">Save site</button>
    </div>
  </div>


</div>

<script>
  const LOCAL_KEY = "dashboard_projects_cache_v1";
  const API_BASE = "/api/projects";

  // Set this to the same value as the DASHBOARD_KEY secret in your Pages
  // project settings. Anyone who views this page's source can read it, so
  // only do this if you're fine with the site being effectively unlocked
  // for anyone who finds the URL (see README.md for the Cloudflare Access
  // alternative if you want a real login wall instead).
  const DASHBOARD_KEY = "unkso";

  const DEFAULT_PROJECTS = [
    { id: "1", name: "Easy Tarkov", color: "#c64d2e", repo: "", worker: "", site: "", updated: "2 days ago" },
    { id: "2", name: "MW4 camo tracker", color: "#fecf41", repo: "", worker: "", site: "", updated: "5 hours ago" },
    { id: "3", name: "Spotify jukebox", color: "#1fd05c", repo: "", worker: "", site: "", updated: "1 hour ago" }
  ];

  let editingId = null;
  let usingFallback = false;

  function loadLocalCache(){
    try{
      const raw = localStorage.getItem(LOCAL_KEY);
      if(!raw){
        localStorage.setItem(LOCAL_KEY, JSON.stringify(DEFAULT_PROJECTS));
        return DEFAULT_PROJECTS.slice();
      }
      return JSON.parse(raw);
    }catch(e){ return DEFAULT_PROJECTS.slice(); }
  }
  function saveLocalCache(projects){ localStorage.setItem(LOCAL_KEY, JSON.stringify(projects)); }

  // ---- data layer: talks to the Pages Function at /api/projects,
  // falls back to a locally cached copy if that API isn't reachable yet
  // (e.g. before the Function + KV binding are deployed) ----
  async function fetchProjects(){
    try{
      const res = await fetch(API_BASE);
      if(!res.ok) throw new Error("bad response");
      const data = await res.json();
      saveLocalCache(data);
      usingFallback = false;
      return data;
    }catch(e){
      usingFallback = true;
      return loadLocalCache();
    }
  }

  async function createProject(project){
    const res = await fetch(API_BASE, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + DASHBOARD_KEY },
      body: JSON.stringify(project)
    });
    if(!res.ok){
      alert("Couldn't save. Check that DASHBOARD_KEY in index.html matches your Pages secret.");
      return false;
    }
    return true;
  }

  async function updateProject(id, project){
    const res = await fetch(API_BASE + "/" + encodeURIComponent(id), {
      method: "PUT",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + DASHBOARD_KEY },
      body: JSON.stringify(project)
    });
    if(!res.ok){
      alert("Couldn't save. Check that DASHBOARD_KEY in index.html matches your Pages secret.");
      return false;
    }
    return true;
  }

  async function deleteProject(id){
    const res = await fetch(API_BASE + "/" + encodeURIComponent(id), {
      method: "DELETE",
      headers: { "Authorization": "Bearer " + DASHBOARD_KEY }
    });
    if(!res.ok){
      alert("Couldn't delete. Check that DASHBOARD_KEY in index.html matches your Pages secret.");
      return false;
    }
    return true;
  }

  async function reorderProjects(order){
    try{
      const res = await fetch(API_BASE + "/reorder", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + DASHBOARD_KEY },
        body: JSON.stringify({ order })
      });
      return res.ok;
    }catch(e){
      return false;
    }
  }

  // ---- icons ----
  function iconGithub(){
    return '<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.58 2 12.26c0 4.54 2.87 8.39 6.84 9.75.5.1.68-.22.68-.49 0-.24-.01-.87-.01-1.71-2.78.62-3.37-1.37-3.37-1.37-.46-1.19-1.11-1.51-1.11-1.51-.91-.63.07-.62.07-.62 1 .07 1.53 1.05 1.53 1.05.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.05 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05a9.3 9.3 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.92-2.34 4.79-4.57 5.04.36.32.68.94.68 1.9 0 1.37-.01 2.48-.01 2.81 0 .27.18.6.69.49A10.02 10.02 0 0 0 22 12.26C22 6.58 17.52 2 12 2z"/></svg>';
  }
  function iconWorker(){
    return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>';
  }
  function iconWorld(){
    return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>';
  }
  function iconTrash(){
    return '<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';
  }
  function iconEdit(){
    return '<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>';
  }
  function iconGrip(){
    return '<svg class="icon-sm" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg>';
  }
  function iconChevronUp(){
    return '<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>';
  }
  function iconChevronDown(){
    return '<svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';
  }

  function linkOrDisabled(url, label, icon, primary){
    if(url){
      const cls = primary ? "link-btn primary" : "link-btn";
      return `<a class="${cls}" href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">${icon}${label}</a>`;
    }
    return `<span class="link-btn disabled">${icon}${label}</span>`;
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }
  function escapeAttr(str){ return escapeHtml(str); }

  function renderSyncBanner(){
    const slot = document.getElementById("sync-banner-slot");
    if(!usingFallback){
      slot.innerHTML = "";
      return;
    }
    slot.innerHTML = `<div class="sync-banner">
      <span>Couldn't reach the sync API — showing a locally cached copy.</span>
    </div>`;
  }

  let cachedProjects = [];

  async function render(){
    const projects = await fetchProjects();
    renderSyncBanner();
    cachedProjects = projects;
    renderList();
  }

  function renderList(){
    const list = document.getElementById("project-list");
    const projects = cachedProjects;

    if(projects.length === 0){
      list.innerHTML = '<div class="empty">No projects yet. Add your first one below.</div>';
      return;
    }

    list.innerHTML = projects.map((p, i) => `
      <div class="project" draggable="true" data-id="${escapeAttr(p.id)}" style="border-left-color:${escapeAttr(p.color)}">
        <div class="drag-handle" title="Drag to reorder" aria-hidden="true">${iconGrip()}</div>
        <div class="dot" style="background:${escapeAttr(p.color)}"></div>
        <div class="meta">
          <p class="name">${escapeHtml(p.name)}</p>
          <p class="date">Updated ${escapeHtml(p.updated || "just now")}</p>
        </div>
        <div class="links">
          ${linkOrDisabled(p.repo, "Repo", iconGithub())}
          ${linkOrDisabled(p.worker, "Worker", iconWorker())}
          ${linkOrDisabled(p.site, "Live site", iconWorld(), true)}
        </div>
        <div class="row-actions">
          <div class="move-group">
            <button class="move-btn" data-id="${escapeAttr(p.id)}" data-dir="up" title="Move up" aria-label="Move ${escapeHtml(p.name)} up" ${i === 0 ? "disabled" : ""}>${iconChevronUp()}</button>
            <button class="move-btn" data-id="${escapeAttr(p.id)}" data-dir="down" title="Move down" aria-label="Move ${escapeHtml(p.name)} down" ${i === projects.length - 1 ? "disabled" : ""}>${iconChevronDown()}</button>
          </div>
          <button class="edit-btn" data-id="${escapeAttr(p.id)}" title="Edit project" aria-label="Edit ${escapeHtml(p.name)}">${iconEdit()}</button>
          <button class="del-btn" data-id="${escapeAttr(p.id)}" title="Delete project" aria-label="Delete ${escapeHtml(p.name)}">${iconTrash()}</button>
        </div>
      </div>
    `).join("");

    list.querySelectorAll(".del-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const ok = await deleteProject(btn.getAttribute("data-id"));
        if(ok) render();
      });
    });
    list.querySelectorAll(".edit-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const project = cachedProjects.find(p => p.id === btn.getAttribute("data-id"));
        if(project) showNewSite(project);
      });
    });
    list.querySelectorAll(".move-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-id");
        const dir = btn.getAttribute("data-dir");
        const ids = cachedProjects.map(p => p.id);
        const idx = ids.indexOf(id);
        const swapWith = dir === "up" ? idx - 1 : idx + 1;
        if(swapWith < 0 || swapWith >= ids.length) return;
        [ids[idx], ids[swapWith]] = [ids[swapWith], ids[idx]];
        applyOrder(ids);
      });
    });

    let dragSrcId = null;
    list.querySelectorAll(".project").forEach(row => {
      row.addEventListener("dragstart", () => {
        dragSrcId = row.getAttribute("data-id");
        row.classList.add("dragging");
      });
      row.addEventListener("dragend", () => {
        row.classList.remove("dragging");
        list.querySelectorAll(".project").forEach(r => r.classList.remove("drag-over"));
      });
      row.addEventListener("dragover", (e) => {
        e.preventDefault();
        row.classList.add("drag-over");
      });
      row.addEventListener("dragleave", () => {
        row.classList.remove("drag-over");
      });
      row.addEventListener("drop", (e) => {
        e.preventDefault();
        row.classList.remove("drag-over");
        const targetId = row.getAttribute("data-id");
        if(!dragSrcId || dragSrcId === targetId) return;
        const ids = cachedProjects.map(p => p.id);
        const from = ids.indexOf(dragSrcId);
        const to = ids.indexOf(targetId);
        if(from === -1 || to === -1) return;
        ids.splice(from, 1);
        ids.splice(to, 0, dragSrcId);
        applyOrder(ids);
      });
    });
  }

  async function applyOrder(ids){
    // Reorder instantly in the UI, then persist in the background.
    cachedProjects = ids.map(id => cachedProjects.find(p => p.id === id)).filter(Boolean);
    renderList();
    const ok = await reorderProjects(ids);
    if(!ok) render();
  }

  function showDashboard(){
    document.getElementById("dashboard-view").style.display = "block";
    document.getElementById("new-site-view").style.display = "none";
    render();
  }

  function showNewSite(project){
    editingId = project ? project.id : null;
    document.getElementById("dashboard-view").style.display = "none";
    document.getElementById("new-site-view").style.display = "block";

    document.getElementById("f-name").value = project ? project.name : "";
    document.getElementById("f-repo").value = project ? project.repo : "";
    document.getElementById("f-worker").value = project ? project.worker : "";
    document.getElementById("f-site").value = project ? project.site : "";
    document.getElementById("f-color").value = project ? project.color : "#7f77dd";
    document.getElementById("save-btn").textContent = project ? "Save changes" : "Save site";

    document.querySelectorAll(".swatch").forEach(s => {
      s.classList.toggle("selected", !!project && s.getAttribute("data-color") === project.color);
    });
    document.getElementById("f-name").focus();
  }

  document.getElementById("new-site-btn").addEventListener("click", () => showNewSite(null));
  document.getElementById("back-btn").addEventListener("click", showDashboard);

  document.querySelectorAll(".swatch").forEach(sw => {
    sw.addEventListener("click", () => {
      document.getElementById("f-color").value = sw.getAttribute("data-color");
      document.querySelectorAll(".swatch").forEach(s => s.classList.remove("selected"));
      sw.classList.add("selected");
    });
  });

  document.getElementById("save-btn").addEventListener("click", async () => {
    const name = document.getElementById("f-name").value.trim();
    if(!name){
      document.getElementById("f-name").focus();
      return;
    }
    const project = {
      name,
      color: document.getElementById("f-color").value,
      repo: document.getElementById("f-repo").value.trim(),
      worker: document.getElementById("f-worker").value.trim(),
      site: document.getElementById("f-site").value.trim()
    };
    const ok = editingId ? await updateProject(editingId, project) : await createProject(project);
    if(ok) showDashboard();
  });

  showDashboard();
</script>
</body>
</html>
